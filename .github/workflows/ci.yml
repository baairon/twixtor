name: CI

on:
  # Every push to main runs, so main always carries a check of its own, and so
  # does every pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On a pull request a new push supersedes the run in flight: only the branch's
# latest commit needs a verdict. A push to main is never cancelled and never
# waits behind another one: each is a group of its own, so commits pushed one
# after another all keep a result of their own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests keep opt-level 3 but skip LTO and split codegen: the same results,
  # minutes less compiling.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  test:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing should never hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Python tools shell out to ffmpeg and ffprobe, and the harness
      # tests render their inputs with it. The 32 bpc test patterns need a geq
      # that accepts float formats, which distribution builds may lack, so
      # Linux uses a static 9.0 build.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      # The release profile is the one the tests run in: the optical flow
      # and thread invariance suites are far too slow unoptimised.
      - run: cargo build --release -p fx-cli

      # Without --no-fail-fast cargo stops at the first failing test binary,
      # which hid every later suite on macOS.
      - run: cargo test --workspace --release --no-fail-fast

      # The tools pick the vfx binary up from target/release.
      - run: python tools/test_speed_curve.py

      - run: python tools/test_apply.py

      - run: python tools/test_repeat_keys.py

      # The stage contract of apply.py (--pre-stage, --post-stage, frames/2)
      # and the ffmpeg-filter stage.
      - run: python tools/test_stages.py

      - run: python tools/test_ffstage.py

      # The handoff control plane and the conformance suite (docs/handoff.md).
      - run: python -I tools/test_handoff.py

      - run: python -I tools/test_conformance.py

      # sapphire is not checked out here (no token, no secret), so every part
      # that needs sapphire prints a NOT RUN line that names the absent
      # peer. --allow-absent-peer lets only those parts through: anything else
      # that does not run, and every failed check, still fails the job.
      - run: python -I tools/conformance.py --quick --allow-absent-peer

      # The parity record (docs/parity.md): every generated figure equals a
      # fresh generation from docs/data/ and the tree, the documentation
      # checks pass (the flag tables need VFX_PATH and are skipped here), and
      # the generator and the regression lock tool pass their tests.
      - run: python -I tools/gen_docs.py --check

      - run: python -I tools/check_docs.py

      - run: python -I tools/test_docgen.py

      - run: python tools/test_parity_lock.py

      # The retimed audio map (no tools needed), then the HDR and odd size
      # encodes and the --size and --fps runs of apply.py (ffmpeg, ffprobe
      # and vfx; the HDR cases skip without a 10 bit libx265).
      - run: python tools/test_audio_map.py

      - run: python tools/test_apply_hdr.py

      - run: python tools/test_apply_geometry.py
