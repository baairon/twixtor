[package]
name = "retime-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The shared engine of the effects: time maps, optical flow, warps, blends and hole filling."

[dependencies]
fx-core.workspace = true
rayon.workspace = true

[features]
default = ["emulator-nan"]
# Which NaN an operation on two NaNs returns (`src/nanrule.rs`): on, the x87 selection of the emulator the references were
# rendered with; off, the processor's rule (the first operand).
emulator-nan = []
